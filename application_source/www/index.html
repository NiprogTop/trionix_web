<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="images/Icon.svg">

    <link rel="stylesheet" href="style/hamburger.css">
    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/main.css">

    <script src="scripts/adaptiveWeb.js" defer></script>

    <title>TRIONIX LAB Control Center</title>
</head>

<body>
    <div id="rotate">Поверните устройство!</div>

    <div id="screens_container">
        <iframe id="control_screen" src="controlCenter/index.html"></iframe>
        <iframe id="map_screen" src="leafletMap/index.html"></iframe>
        <iframe id="config_screen" src="jsonEditor/index.html"></iframe>
    </div>

    <div>
        <input id="hamburger_toggle" type="checkbox" />

        <label class="hamburger_button" for="hamburger_toggle">
            <span></span>
        </label>

        <ul class="hamburger_box" id="screenSelector">
            <li class="hamburger_item" id="control_select">Управление</li>
            <li class="hamburger_item" id="map_select">Карты</li>
            <li class="hamburger_item" id="config_select">Конфигурация PID</li>
            <li class="hamburger_item" id="mission_select">Автономность</li>
            <li class="hamburger_item" id="settings_select">Настройки</li>
        </ul>
    </div>
</body>

</html>
