<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--<link rel="stylesheet" href="style/reset.css">-->
    <link rel="stylesheet" href="style/main.css">

    <link rel="stylesheet" href="../../style/table_builder.css">
    <link rel="stylesheet" href="../../style/custom_elements/include.css">

    <script src="../../libraries/roslib/roslib.min.js" defer></script>
    <script src="../../libraries/joystick_input/joy.js" defer></script>

    <!--<script src="scripts/galary.js" defer></script>-->
    <script src="scripts/fullscreen.js" defer></script>
    <script src="scripts/main.js" defer></script>
</head>

<body>
    <img id="videoImage">

    <div id="main" class="tb-column">
        <div class="tb-row tb-space-evenly">
            <div id="pitch" class="div-holder"><h2>Дифферент: ---</h2></div>
            <div id="heading" class="div-holder"><h2>Курс: ---</h2></div>
            <div id="depth" class="div-holder"><h2>Глубина: ---</h2></div>
        </div>

        <div class="tb-row tb-grow-10">
            <div class="tb-grow-01"></div>

            <div class="tb-column">
                <div class="tb-grow-01"></div>

                <div class="tb-grow-02 div-holder">
                    <p><b><h2>Удержание глубины</h2></b></p>
                    <input id="button-ch" type="checkbox" class="checkbox-slider" />
                </div>

                <div class="tb-space-evenly">
                    <button id="grab_2" class="button-square-base button-grab-right"></button>
                    <button id="grab_1" class="button-square-base button-grab-left"></button>
                </div>

                <div id="joy_screen" class="tb-align-down tb-row tb-center">
                    <div id="joyDivLeft" class="joy_left"></div>
                </div>
            </div>

            <div class="tb-column tb-align-right">
                <div class="tb-grow-01"></div>

                <div class="tb-grow-01 tb-space-evenly">
                    <button id="fullscreen" class="button-circle-base button-fullscreen"></button>
                    <button id="photo" class="button-circle-base button-photo"></button>
                    <button id="mode" class="button-circle-base" style="background-color: green;"></button>
                    <button id="flashlight" class="button-circle-base button-flashlight"></button>
                </div>

                <div class="tb-grow-02 div-holder">
                    <div class="tb-row tb-space-evenly">
                        <button id="pid_up" class="button-rectangle-base button-triangle-up"></button>
                        <button id="pid_down" class="button-rectangle-base button-triangle-down"></button>
                    </div>

                    <p><h2><b>Установка глубины</b></h2></p>

                    <a><h2><b id="target_depth">0.0</b></h2></a>
                </div>

                <div id="joy_screen" class="tb-align-down tb-row tb-center">
                    <div id="joyDivRight" class="joy_rigth"></div>
                </div>
            </div>

            <div class="tb-grow-01"></div>
        </div>

        <div class="tb-row tb-center">
            <div class="div-holder">TRIONIX</div>
        </div>
    </div>
</body>

</html>
