<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--<link rel="stylesheet" href="style/reset.css">-->
    <link rel="stylesheet" href="style/main.css">

    <link rel="stylesheet" href="../../style/table_builder.css">
    <link rel="stylesheet" href="../../style/custom_elements/include.css">

    <script src="../../libraries/roslib/roslib.min.js" defer></script>

<body>
    <!--<div class="container1">
        <img id="videoImage">
    </div>-->

    <div id="main" class="tb-column">
        <div class="tb-row tb-space-evenly">
            <div id="pitch" class="div-holder"><h2>Дифферент: ---</h2></div>
            <div id="heading" class="div-holder"><h2>Курс: ---</h2></div>
            <div id="depth" class="div-holder"><h2>Глубина: ---</h2></div>
        </div>

        <div class="tb-row tb-grow-10">
            <div class="tb-grow-01"></div>

            <div class="tb-column tb-grow-01">
                <div class="tb-grow-01"></div>

                <div class="tb-grow-02 div-holder">
                    <p><b><h2>Удержание глубины</h2></b></p>
                    <input id="button-ch" type="checkbox" class="checkbox-slider" />
                </div>

                <div class="tb-grow-01 tb-space-evenly">
                    <button class="button-base button-grab-right"></button>
                    <button class="button-base button-grab-left"></button>
                </div>
            </div>

            <div class="tb-grow-01 tb-column tb-align-right">
                <div class="tb-grow-01"></div>

                <div class="tb-grow-01 tb-space-evenly">
                    <button class="button-base button-fullscreen"></button>
                    <button class="button-base button-photo"></button>
                    <button class="button-base" style="background-color: green;"></button>
                    <button class="button-base button-flashlight"></button>
                </div>

                <div class="tb-grow-02 div-holder">
                    <div class="tb-row tb-space-evenly">
                        <button class="button-base button-triangle-up"></button>
                        <button class="button-base button-triangle-down"></button>
                    </div>

                    <p><h2><b>Удержание глубины</b></h2></p>

                    <a><h2><b>0.0</b></h2></a>
                </div>
            </div>

            <div class="tb-grow-01"></div>
        </div>

        <div class="tb-row tb-center">
            <div class="div-holder">ROBOT NAME</div>
        </div>
    </div>
