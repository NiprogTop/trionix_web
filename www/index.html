<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="images/Icon.svg">
    
    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/main.css">

    <script src="scripts/roslib.min.js" defer></script>
    <script src="scripts/joy.js" defer></script>
    <script src="scripts/galary.js" defer></script>
    <script src="scripts/fullscreen.js" defer></script>
    <script src="scripts/main.js" defer></script>
    <script src="scripts/adaptiveWeb.js" defer></script>

    <title>TRIONIX LAB Control Center</title>
</head>

<body>
    <div class="container1">
        <img id="videoImage">
    </div>

    <div id="rotate">Поверните устройство!</div>

    <div class="black_page_base" id="black_page"></div>

    <div id="mapElement" align="center">
        <iframe width="100%" height="100%" src="leafletMap/index.html"></iframe>
    </div>

    <div id="configELement" align="center">
        <iframe width="100%" height="100%" src="jsonEditor/index.html"></iframe>
    </div>

    <div class="container buttons">
        <div class="hamburger-menu">

            <input id="menu__toggle" type="checkbox" />

            <label class="menu__btn" for="menu__toggle">
                <span></span>
            </label>

            <ul class="menu__box" id="menu__box">
                <li><a class="menu__item" id="main_screen" href="#">Управление</a></li>
                <li><a class="menu__item" id="map_screen" href="#">Карты</a></li>
                <li><a class="menu__item" id="config_screen" href="#">Найтрока конфигурации PID</a></li>
                <li><a class="menu__item" id="mission_screen" href="#">Автономность</a></li>
                <li><a class="menu__item" id="settings_screen" href="#">Настройки</a></li>
            </ul>
        </div>

        <button type="flashlight" class="button btn-flashlight" id="flashlight" name="flashlight"></button>
        <button type="mode" class="button btn-mode" id="mode" name="mode"></button>
        <button type="photo" class="button btn-photo" id="photo" name="photo"></button>
        <button type="fullscreen" class="button btn-fullscreen" id="fullscreen" name="fullscreen"></button>

        <div class="pid_control">
            <button type="" class="button btn-pid-down" id="pid_down" name=""></button>
            <button type="" class="button btn-pid-up" id="pid_up" name=""></button>
            <div class="pid_lable">Установка глубины</div>
            <div id="target_depth" class="pid_target_depth"> 0.0 </div>
        </div>

        <div class="grab">
            <button type="" class="button btn-grab btn-grab_up" id="grab_1" name=""></button>
            <button type="" class="button btn-grab btn-grab_down" id="grab_2" name=""></button>
        </div>

        <div id="depth" class="depth-class">Глубина: ---</div>
        <div id="pitch" class="pitch-class">Дифферент: ---</div>
        <div id="heading" class="heading-class">Курс: ---</div>

        <div class="pid_switch">
            <label class="pid_lable">Удержание глубины</label>
            <div class="buttonss r" id="button-1">
                <input type="checkbox" class="checkbox" id="button-ch" />
                <div class="knobs"></div>
                <div class="layer"></div>
            </div>
        </div>

        <div id="settings" class="settings_block">
            <div align="center">
                <h2 align="center" class="blockname">IP адрес робота</h2>
                <input id="ipRobot" />
            </div>

            <div align="center">
                <h2 align="center" class="blockname">Установить тип робота (ручной режим)</h2>
                <select id="selectCurRobotType">
                    <option value="trionix" selected>тип ТРИОНИКС</option>
                    <option value="guppy">тип ГУППИ</option>
                    <option value="bag">тип Жук</option>
                </select>
            </div>

            <h2 class="blockname">Настройки портов</h2>
            <div class="settings_grid" id="settings_grid"></div>

            <div class="setting_buttons">
                <button class="settings_upload button_set" id="settings_upload"> Обновить </button>
                <button class="settings_save button_set" id="settings_save"> Сохранить </button>
            </div>
        </div>

        <div class="name">TRIONIX</div>

        <div id="joy_screen">
            <div id="joyDivLeft" class="joy_left"></div>
            <div id="joyDivRight" class="joy_rigth"></div>
        </div>
    </div>
</body>

</html>
